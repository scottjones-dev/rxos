name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node and TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  qt:
    name: Qt displays
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QSG_RHI_BACKEND: software
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build build-essential \
            fonts-noto-core \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          modules: "qtwebsockets"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm qt:configure
      - run: pnpm qt:lint
      - run: pnpm qt:build
      - name: Build display reliability runner and dependencies
        run: pnpm --filter @rxos/vehicle-simulator... build
      - name: Build milestone 1.3 validation tooling
        run: pnpm --filter @rxos/validation-tools... build
      - run: pnpm localisation:validate
      - run: pnpm qt:test
      - name: Bootstrap deterministic baselines for the first milestone 1.3 run
        run: pnpm visual:baseline
      - run: pnpm visual:verify
      - run: pnpm performance:native:short
      - name: Upload visual and performance review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rxos-milestone-1.3-review
          if-no-files-found: warn
          path: |
            tests/visual/baselines
            build/visual/current
            build/visual/diff
            build/visual/gallery
            build/performance
