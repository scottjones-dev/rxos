name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node and TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  qt:
    name: Qt displays
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QSG_RHI_BACKEND: software
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build build-essential \
            fonts-noto-core \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 xvfb
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          modules: "qtwebsockets"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm qt:configure
      - run: pnpm qt:lint
      - run: pnpm qt:build
      - run: pnpm qt:configure:release
      - run: pnpm qt:build:release
      - name: Build display reliability runner and dependencies
        run: pnpm --filter @rxos/vehicle-simulator... build
      - name: Build milestone 1.3 validation tooling
        run: pnpm --filter @rxos/validation-tools... build
      - name: Validate milestone 1.5 prototype software
        run: |
          node apps/validation-tools/dist/src/display-detection.js \
            --inventory hardware/displays/fixtures/virtual-dual.json \
            --output build/prototype-display-detection.json
          node apps/validation-tools/dist/src/prototype-launcher.js \
            --inventory hardware/displays/fixtures/virtual-dual.json \
            --validate-only --output build/prototype-validation
          node apps/validation-tools/dist/src/prototype-simulate.js rotary \
            build/prototype-rotary.json
          node apps/validation-tools/dist/src/prototype-simulate.js power \
            build/prototype-power.json
          node apps/validation-tools/dist/src/prototype-simulate.js boot \
            build/prototype-boot.json
          node apps/validation-tools/dist/src/prototype-review.js \
            --kind occlusion \
            --input hardware/displays/fixtures/driver-occlusion-synthetic.json \
            --output build/prototype-review
          node apps/validation-tools/dist/src/prototype-review.js \
            --kind touch \
            --input hardware/displays/fixtures/cabin-touch-synthetic.json \
            --output build/prototype-review
      - run: pnpm localisation:validate
      - run: pnpm qt:test
      - run: pnpm visual:verify
      - name: Short native driver profile
        run: pnpm performance:native:driver
      - name: Short native cabin profile
        run: pnpm performance:native:cabin
      - name: Short concurrent native profile
        run: pnpm performance:native:concurrent
      - name: Chart stress profile
        run: pnpm performance:native:chart
      - name: Xvfb cabin profile
        run: |
          xvfb-run -a env QT_QPA_PLATFORM=xcb QSG_RHI_BACKEND=software \
            node apps/validation-tools/dist/src/linux-performance.js \
              --duration 60 --topology cabin --rates 60 --scenario home \
              --output build/performance/native-cabin-xvfb.json
      - name: Check stable performance invariants
        run: |
          pnpm performance:native:compare build/performance/native-concurrent-short.json
          pnpm performance:native:compare build/performance/chart-stress.json
      - name: Create native performance summary
        run: pnpm performance:native:artifact build/performance/native-concurrent-short.json build/performance/native-concurrent-short.md
      - name: Create redacted prototype diagnostics
        run: |
          node apps/validation-tools/dist/src/prototype-diagnostics.js \
            --display-report build/prototype-display-detection.json \
            --assignment build/prototype-validation/assignment.json \
            --performance build/performance/native-concurrent-short.json \
            --output build/prototype-diagnostics
      - name: Upload visual and performance review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rxos-milestone-1.4-review
          if-no-files-found: warn
          path: |
            tests/visual/baselines
            build/visual/current
            build/visual/diff
            build/visual/gallery
            build/performance
            build/prototype-display-detection.json
            build/prototype-validation
            build/prototype-rotary.json
            build/prototype-power.json
            build/prototype-boot.json
            build/prototype-review
            build/prototype-diagnostics
